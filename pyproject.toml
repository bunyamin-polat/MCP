[project]
name = "mcp-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
